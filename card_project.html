<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Mini Project</title>
    <link rel="stylesheet" href="profile_style.css">
</head>
<body>
    <header class="sticky-header">
        <h1>My Profile</h1>
    </header>
    <section class="profile-card">
        <div class="badge">⭐</div>
        <img src="https://i.pinimg.com/736x/e8/29/e0/e829e0a56266a7ad2e1cb246d3ae8485.jpg" alt="Profile pic" class="profile-img" >
        <h2 class="name">Amrthesh A</h2>
        <p class="bio">
            Front-end developer with 1 year of experience building user
            friendly tools.Also experienced in backend and AI engineering.
        </p>
        <div class="stats">
            <div class="stat"><h3>30</h3>
                <p>projects</p>
            </div>
            <div class="stat"><h3>85+</h3>
                <p>clients</p>
            </div>
            <div class="stat"><h3>10+</h3>
                <p>Awards</p>
            </div>
        </div>
    </section>
    <button class="contact-btn">📩Contact me</button>
</body>
</html>
